# Tiny Tapeout project information
project:
  title:        "Centinela-CO: fail-safe carbon monoxide dose monitor for gas heaters"
  author:       "Equipo UTCJ - IEEE Open Silicon Bootcamp 2026"
  discord:      ""
  description:  "Two-channel CO dose integrator that withdraws a dynamic gas-valve permission inside the UL 2034 time windows"
  language:     "Verilog"
  clock_hz:     32768

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_utcj_centinela_co"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "CO[0] (2 ppm)"
  ui[1]: "CO[1] (4 ppm)"
  ui[2]: "CO[2] (8 ppm)"
  ui[3]: "CO[3] (16 ppm)"
  ui[4]: "CO[4] (32 ppm)"
  ui[5]: "CO[5] (64 ppm)"
  ui[6]: "CO[6] (128 ppm)"
  ui[7]: "CO[7] (256 ppm)"

  # Outputs
  uo[0]: "SEG_A"
  uo[1]: "SEG_B"
  uo[2]: "SEG_C"
  uo[3]: "SEG_D"
  uo[4]: "SEG_E"
  uo[5]: "SEG_F"
  uo[6]: "SEG_G"
  uo[7]: "DP (valve permitted)"

  # Bidirectional pins
  uio[0]: "STROBE (in): one pulse per sensor sample"
  uio[1]: "REARM (in): manual re-arm button"
  uio[2]: "DEMO (in): 1 = internal sampling, time x64"
  uio[3]: "CHAIN_OK (in): external safety chain closed"
  uio[4]: "VALVE_A (out): dynamic permission, phase A"
  uio[5]: "VALVE_B (out): dynamic permission, phase B"
  uio[6]: "ALARM (out)"
  uio[7]: "FAULT (out)"

# Do not change!
yaml_version: 6
